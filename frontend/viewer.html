<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports Portal — WILDSHIELD AI</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">
    <!-- ===== Slim forest rail ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a class="brand-mark" href="viewer.html" aria-label="WildShield AI">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 5.5L8.5 11.5v12.1c0 11 7.2 18.4 15.5 21.4 8.3-3 15.5-10.4 15.5-21.4V11.5L24 5.5z" fill="rgba(111,156,117,0.10)" stroke="#6f9c75" stroke-width="1.6"/>
            <path d="M24 11l-4.4 6.8h3.3l-2 8 3.1-5v7.6l2.4-3.6 2.4 3.6v-7.6l3.1 5-2-8h3.3L24 11z" fill="#8fb98f" stroke="#C9E0B8" stroke-width="0.8" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <nav class="sidebar-links">
        <span class="nav-label">Access</span>
        <a class="sidebar-link active" href="viewer.html">
          <span class="s-icon">&#128196;</span><span>Reports</span>
        </a>
        <span class="nav-label">System</span>
        <a class="sidebar-link danger" href="#" id="logoutBtn">
          <span class="s-icon">&#10145;</span><span>Exit</span>
        </a>
      </nav>

      <div class="sidebar-user">
        <span class="sidebar-avatar">V</span>
        <span class="u-name" id="userInfo">Loading...</span>
        <span class="u-role">Read-Only Viewer</span>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ===== Main ===== -->
    <div class="main-area">
      <header class="main-top">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
        <span class="mt-title">Reports Portal</span>
        <div class="mt-actions"></div>
      </header>

      <main class="main-inner">
        <div class="dash-header">
          <div>
            <div class="page-eyebrow">Read-Only Access</div>
            <h1>Reports Portal</h1>
            <p class="sub">Verified incident reports from the monitored belt. All findings are decision-support only.</p>
          </div>
        </div>

        <div class="dash-panel">
          <div class="panel-head">
            <h2>&#128196; Generated Reports</h2>
            <span class="section-num">Archive / Read Only</span>
          </div>
          <div id="reportsList" class="recent-list">
            <div class="loading-row">
              <div class="shimmer"></div><div class="shimmer"></div><div class="shimmer"></div>
            </div>
          </div>

          <div id="pagination" class="pagination" style="display:none;">
            <button class="btn btn-ghost btn-sm" id="prevPage">&#8592; Previous</button>
            <span id="pageInfo" class="muted"></span>
            <button class="btn btn-ghost btn-sm" id="nextPage">Next &#8594;</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    document.getElementById('menuToggle').addEventListener('click', function () {
      document.body.classList.toggle('sidebar-open');
    });
    document.getElementById('sidebarBackdrop').addEventListener('click', function () {
      document.body.classList.remove('sidebar-open');
    });
  </script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
