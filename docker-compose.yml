services:
  # --- MongoDB ---
  mongo:
    image: mongo:7
    container_name: wildshield-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Node.js API backend ---
  backend:
    build: ./backend
    container_name: wildshield-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/wildshield
      CORS_ORIGIN: http://localhost:5000,http://127.0.0.1:5000
      STATIC_FRONTEND: "true"
      AI_SERVICE_URL: http://ai-service:8000
      DEMO_MODE: "false"
      # JWT_SECRET must be provided via .env or environment - never hard-coded
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "5000:5000"
    volumes:
      - media_data:/app/uploads

  # --- Python AI service (Phase 1: shell + health only) ---
  ai-service:
    build: ./ai-service
    container_name: wildshield-ai
    restart: unless-stopped
    environment:
      AI_ENV: production
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      MODEL_PATH: models/yolo11n.pt
      FRAME_INTERVAL: 10
      DEMO_MODE: "false"
    ports:
      - "8000:8000"

volumes:
  mongo_data:
  media_data:
